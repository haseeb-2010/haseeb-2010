<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="GitHub developer profile overview">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c31"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="#3b82f6" stop-opacity=".22"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/></filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle cx="1080" cy="-10" r="270" fill="url(#glow)"/>
<circle cx="90" cy="360" r="220" fill="url(#glow)" opacity=".55"/>
<rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#263650" stroke-width="2"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
 <text x="58" y="75" fill="#93a4bd" font-size="14" font-weight="700" letter-spacing="2.8">DEVELOPER PROFILE</text>
 <text x="58" y="124" fill="#f8fafc" font-size="38" font-weight="750" letter-spacing="-1.1">GitHub at a glance</text>
 <text x="60" y="157" fill="#9aabc2" font-size="17" font-weight="450">A concise snapshot of my coding activity and developer footprint.</text>
 <rect x="58" y="184" width="1084" height="2" rx="1" fill="#25334a"/>
 <rect x="58" y="184" width="118" height="2" rx="1" fill="url(#accent)"/>
 <!-- cards -->
 <g filter="url(#shadow)">
  <rect x="58" y="211" width="252" height="112" rx="17" fill="#121f33" stroke="#2a3b55"/>
  <rect x="328" y="211" width="252" height="112" rx="17" fill="#121f33" stroke="#2a3b55"/>
  <rect x="598" y="211" width="252" height="112" rx="17" fill="#121f33" stroke="#2a3b55"/>
  <rect x="868" y="211" width="274" height="112" rx="17" fill="#121f33" stroke="#2a3b55"/>
 </g>
 <!-- star icon -->
 <path d="M83 238l5.2 10.6 11.7 1.7-8.45 8.2 2 11.6-10.45-5.5-10.45 5.5 2-11.6-8.45-8.2 11.7-1.7z" fill="#fbbf24"/>
 <text x="112" y="255" fill="#a9bad0" font-size="14" font-weight="650" letter-spacing=".8">STARS EARNED</text>
 <text x="82" y="302" fill="#f8fafc" font-size="34" font-weight="760">0</text>
 <!-- contribution icon -->
 <rect x="353" y="237" width="19" height="19" rx="4" fill="none" stroke="#38bdf8" stroke-width="2"/><path d="M358 246h9M362.5 241.5v9" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
 <text x="384" y="255" fill="#a9bad0" font-size="14" font-weight="650" letter-spacing=".8">CONTRIBUTIONS</text>
 <text x="352" y="302" fill="#f8fafc" font-size="34" font-weight="760">181</text>
 <!-- repos icon -->
 <path d="M624 239h16l5 5v17h-21z" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/><path d="M640 239v6h5M629 250h11M629 255h11" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round"/>
 <text x="656" y="255" fill="#a9bad0" font-size="14" font-weight="650" letter-spacing=".8">PUBLIC REPOSITORIES</text>
 <text x="622" y="302" fill="#f8fafc" font-size="34" font-weight="760">2</text>
 <!-- followers icon -->
 <circle cx="895" cy="244" r="6" fill="none" stroke="#34d399" stroke-width="2"/><path d="M884 261c1.7-7 20.3-7 22 0" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/><circle cx="910" cy="247" r="4" fill="none" stroke="#34d399" stroke-width="1.7"/><path d="M907 260c3-4 10-3 12 1" fill="none" stroke="#34d399" stroke-width="1.7" stroke-linecap="round"/>
 <text x="930" y="255" fill="#a9bad0" font-size="14" font-weight="650" letter-spacing=".8">FOLLOWERS</text>
 <text x="892" y="302" fill="#f8fafc" font-size="34" font-weight="760">0</text>
</g>
</svg>